.today-layout hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.today-layout .primary{margin-top:12px}.empty-day{font-size:13px}
.week-scroll,.calendar-scroll{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.week-board{display:grid;grid-template-columns:repeat(7,minmax(156px,1fr))}

button[aria-pressed=true]{background:#294236;color:var(--accent)}
.calendar-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.calendar-toolbar h1{margin:0 auto 0 0}.calendar-toolbar .space{margin:0}
.calendar-scroll{max-height:68vh}.calendar-grid{display:grid;grid-template-columns:58px repeat(var(--days),minmax(116px,1fr));--hour:42px}
.calendar-heading{position:sticky;top:0;z-index:3;height:54px;background:#202730;border-bottom:1px solid var(--line);display:grid;align-content:center;padding:0 8px;font-size:13px}
.calendar-day{border-left:1px solid var(--line)}.calendar-day.is-current .calendar-heading{background:#294236}
.calendar-hours{position:relative}.time-axis>div:not(.calendar-heading),.time-slot{height:var(--hour);border-bottom:1px solid var(--line)}
.time-axis>div:not(.calendar-heading){padding:6px 8px;color:var(--muted);font-size:11px}
.time-slot{display:block;width:100%;border-radius:0;border-top:0;border-left:0;border-right:0;background:transparent;color:transparent}
.time-slot:hover,.time-slot:focus-visible{background:#293a34;color:var(--accent)}
.calendar-block{position:absolute;z-index:1;top:calc(var(--start)*var(--hour)/60);height:max(22px,calc(var(--length)*var(--hour)/60));left:3px;width:calc(100% - 6px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:2px 5px;font-size:12px;background:#25483d;border-color:#468267}
.calendar-block.entry{background:#343b64;border-color:#717dba}.calendar-block:focus-visible,.calendar-block:hover{z-index:2}
.now-line{position:absolute;pointer-events:none;z-index:2;left:0;right:0;top:calc(var(--start)*var(--hour)/60);border-top:2px solid var(--accent)}
.calendar-key{display:flex;gap:16px}.calendar-key span:first-child{color:var(--accent)}.calendar-key span:last-child{color:#abb6f4}

.week-scroll{background:#141920}.week-board{grid-template-columns:repeat(7,minmax(166px,1fr))}

.week-board article.is-current h2{color:var(--accent)}

.task-copy{min-width:0;display:grid;gap:3px}.task-copy small{font-size:11px;overflow-wrap:anywhere}
.task-card button.task-title,.task-card button.task-focus{border:0;background:transparent;padding:0;text-align:left;border-radius:3px}
.task-title{font-weight:650;overflow-wrap:anywhere}.task-focus{color:var(--muted);font-size:16px!important;line-height:1.15}
.day-add{width:100%;text-align:left;background:transparent;border-style:dashed;color:var(--muted)}
.calendar-block{border-left:2px solid var(--task-accent)}
.in-focus>header{display:none}.in-focus main{max-width:unset;padding:0}

.focus-stage summary{cursor:pointer;color:var(--muted);padding:8px}
.focus-stage details .bar{justify-content:center;margin-top:8px}

.quick-task input::placeholder{color:var(--muted)}.quick-task button{padding:4px 6px}
.other-tasks summary{color:var(--muted);font-size:12px;cursor:pointer;padding:7px 2px 2px}.other-tasks summary span{margin-left:4px}
.wide-planner main{max-width:none;padding:24px clamp(12px,2vw,30px)}
.wide-planner>header{padding-inline:clamp(12px,2vw,30px)}
.calendar-toolbar,.plan-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.plan-toolbar h1,.calendar-toolbar h1{font-size:28px;letter-spacing:-.04em;margin:0}
.plan-toolbar .space,.calendar-toolbar .space{margin:0}.plan-toolbar .space{margin-left:auto}
.calendar-total{margin-left:auto;color:var(--muted)}.calendar-total strong{color:var(--ink)}
.wide-planner .calendar-scroll{max-height:calc(100dvh - 170px);min-height:240px}
.calendar-grid{position:relative;--axis-width:58px;--head-height:54px;grid-template-columns:var(--axis-width) repeat(var(--days),minmax(102px,1fr))}
.calendar-heading{height:var(--head-height);text-align:center}
.calendar-day.is-current .calendar-hours{background:#b8f3ce0b}
.now-line{left:var(--axis-width);top:calc(var(--head-height) + var(--start)*var(--hour)/60)}
.now-line::before{content:"";position:absolute;width:6px;height:6px;top:-4px;left:-2px;border-radius:50%;background:var(--accent)}
.planning-board{position:relative;grid-template-columns:repeat(15,minmax(188px,1fr));gap:10px;padding:9px}
.planning-board article{border:1px solid var(--line);border-radius:12px;background:#191e25;min-height:max(390px,calc(100dvh - 169px))}
.planning-board article.is-current{border-color:#49685c;background:#1b2825}
.planning-board article.is-current header{border-bottom-color:var(--accent)}
.planning-board .task-card{margin:7px 0}
.planning-board .task-copy small{width:fit-content;background:#171e24;border:1px solid var(--line);padding:2px 5px;border-radius:12px}
@media(max-width:760px){.plan-toolbar .space{margin-left:0}.calendar-total{margin-left:0}.calendar-toolbar h1{width:auto}}
.focus-picker{display:grid;gap:8px;width:min(440px,100%);text-align:left}
.focus-choice{display:grid;gap:3px;text-align:left;border-left:3px solid var(--task-accent);padding:10px 12px}
.focus-choice small:empty{display:none}
.untimed-calendar{margin:0 0 14px}.untimed-calendar h2{font-size:14px;margin:0 0 7px}
.untimed-scroll{overflow-x:auto}.untimed-grid{display:grid;grid-template-columns:repeat(7,minmax(102px,1fr));gap:5px}
.untimed-grid>div{padding:6px;background:var(--panel);border-radius:7px;min-width:0}
.untimed-grid strong{font-size:11px;color:var(--muted)}
.untimed-task button{width:100%;text-align:left;overflow-wrap:anywhere;font-size:12px;margin-top:4px;border-left:2px solid var(--task-accent)}
.calendar-block.live{z-index:2;background:#283f3c;border-color:#7bc1ae;border-left-color:var(--task-accent)}
body{--bg:#0e1418;--panel:#172127;--line:#2b3b43;--accent:#a6e4c6}
body>header{gap:12px;padding-block:9px;background:#121c21}
header nav button{border-color:transparent;background:transparent;padding:6px 10px}
header nav button[aria-current=true]{background:#213a34;border-color:#34564c}

.planning-board article.is-current{background:#1b302c}
.calendar-day.is-current .calendar-hours{background:#a6e4c60d}
.task-history h3{font-size:14px;margin:16px 0 4px}

.review-bar{display:flex;align-items:end;height:135px;margin:8px auto;width:min(24px,85%);border-bottom:1px solid var(--line)}

.goal-dot{display:inline-block;width:8px;height:8px;background:var(--task-accent);border-radius:50%;margin-right:8px}

.space-tag{display:inline-block;margin:0 0 8px;padding:2px 7px;border:1px solid var(--line);border-radius:10px;font-size:11px}

 body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
 body>header{flex-wrap:nowrap;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}

 .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:5;width:58px;height:58px;border:0;border-radius:18px;background:var(--accent);color:#102219;font-size:30px;line-height:1;box-shadow:0 6px 20px #000a}
 .fab:hover{color:#102219}.fab[hidden]{display:none}
 #main>button.primary,.today-layout .primary,.calendar-toolbar>.primary{display:none}

 .week-scroll{scroll-snap-type:x mandatory;overscroll-behavior-x:contain;border:0;background:none}
 .planning-board{grid-template-columns:repeat(15,calc(100vw - 56px));padding:0 6px}

 /* Flex statt Grid: nur so kann die Stundenleiste beim seitlichen Wischen links stehen bleiben. */
 .calendar-grid{--axis-width:44px;display:flex;width:max-content;min-width:100%}
 .calendar-day{flex:0 0 max(38vw,calc((100vw - 70px)/var(--days)))}
 .time-axis{flex:0 0 var(--axis-width);position:sticky;left:0;z-index:4;background:var(--panel)}
 .wide-planner .calendar-scroll{max-height:calc(100dvh - 270px)}
 .focus-stage{min-height:calc(100dvh - 90px);padding:64px 16px 30px}
 .focus-exit{top:calc(14px + env(safe-area-inset-top));left:10px}
}
@media(pointer:coarse){
 kbd{display:none}

}

// Importierte und spaeter synchronisierte Daten sind fremde Eingaben. Die Oberflaeche
// setzt einige Felder ungefiltert in HTML ein, deshalb werden ids und Zahlen hier erzwungen.
const safeId=value=>typeof value==='string'&&/^[A-Za-z0-9_@:.-]{1,80}$/.test(value);
// Konto-ids aus Supabase (zugewiesen an, erfasst von, zuletzt geaendert von).
const isUserId=value=>typeof value==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(value);
const number=(value,min,max,fallback)=>{const n=Number(value);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):fallback};
const isDate=value=>typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value);
const isTime=value=>typeof value==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(value);
// table bestimmt die Pflichtfelder, ohne die eine Ansicht beim Rendern abstuerzen wuerde.
function cleanRecord(item,table){
 const clean={...stampRecord(item),updatedAt:number(item.updatedAt,0,Number.MAX_SAFE_INTEGER,0)};
 if(table!=='checks')clean.title=String(clean.title??'').slice(0,500);
 if('notes' in clean)clean.notes=String(clean.notes??'').slice(0,20000);
 if(table==='tasks'||table==='entries'){clean.date=isDate(clean.date)?clean.date:'';clean.time=isTime(clean.time)?clean.time:''}
 if(table==='entries'&&!('seconds' in clean))clean.seconds=0;
 if(table==='routines'){
  if(!('days' in clean))clean.days=[];
  clean.since=isDate(clean.since)?clean.since:'2000-01-01';
  clean.until=isDate(clean.until)?clean.until:'';
 }
 if(typeof clean.space!=='string')clean.space=defaultSpace;
 for(const field of ['goal','task','routine'])if(field in clean&&clean[field]&&!safeId(clean[field]))clean[field]='';
 for(const field of ['assignee','by','changedBy'])if(field in clean&&!isUserId(clean[field]))delete clean[field];
 if('seconds' in clean)clean.seconds=Math.round(number(clean.seconds,0,86400*7,0));
 if('plannedMinutes' in clean)clean.plannedMinutes=number(clean.plannedMinutes,1,1440,30);
 if('interval' in clean)clean.interval=Math.round(number(clean.interval,1,52,1));
 if('days' in clean)clean.days=(Array.isArray(clean.days)?clean.days:[]).map(Number).filter(day=>Number.isInteger(day)&&day>=0&&day<=6);
 return clean;
}
function cleanSpaces(list){
 const result=(Array.isArray(list)?list:[]).filter(space=>isObject(space)&&safeId(space.id)).map(space=>({
  id:space.id,
  name:String(space.name||'Bereich').trim().slice(0,60)||'Bereich',
  kind:space.id===defaultSpace?'private':'team',
  updatedAt:number(space.updatedAt,0,Number.MAX_SAFE_INTEGER,0)
 }));
 return result.some(space=>space.id===defaultSpace)?result:[privateSpace(),...result];
}
const newer=(current,incoming)=>(incoming?.updatedAt||0)>(current?.updatedAt||0);

function migrateChecks(checks){
 const result={};
 for(const [checkId,value] of Object.entries(isObject(checks)?checks:{})){
  if(!safeId(checkId))continue;
  const record=isObject(value)?value:{done:!!value};
  const [routine,date]=checkId.split('@');
  result[checkId]=cleanRecord({...record,routine,date,id:checkId,done:!!record.done},'checks');
 }
 return result;
}

function migrate(raw){
 const source=isObject(raw)?raw:{};
 const data={...blank(),...source,version:2};
 for(const table of tables)data[table]=(Array.isArray(source[table])?source[table]:[]).filter(item=>isObject(item)&&safeId(item.id)).map(item=>cleanRecord(item,table));
 // Farben fest speichern: bisher hing die Farbe ohne Wert an der Position in der Liste.
 data.goals=data.goals.map((goal,index)=>goalColors.includes(goal.color)?goal:{...goal,color:goalColors[index%goalColors.length]});
 data.checks=migrateChecks(source.checks);
 data.spaces=cleanSpaces(source.spaces);
 // Datensaetze aus einem unbekannten Bereich landen im privaten Bereich.
 const known=new Set(data.spaces.map(space=>space.id));
 const fix=item=>known.has(item.space)?item:{...item,space:defaultSpace};
 for(const table of tables)data[table]=data[table].map(fix);
 for(const checkId of Object.keys(data.checks))data.checks[checkId]=fix(data.checks[checkId]);
 if(source.activeSpace!=='alle'&&!known.has(source.activeSpace))data.activeSpace='alle';
 data.tombstones={};
 for(const stone of Object.values(isObject(source.tombstones)?source.tombstones:{}))
  if(isObject(stone)&&safeId(stone.id)&&(stone.table==='checks'||stone.table==='spaces'||tables.includes(stone.table)))
   data.tombstones[stone.table+':'+stone.id]={table:stone.table,id:stone.id,space:typeof stone.space==='string'?stone.space:defaultSpace,updatedAt:number(stone.updatedAt,0,Number.MAX_SAFE_INTEGER,0)};
 return data;
}

function load(storage){
 for(const storageKey of [key,legacyKey]){
  let raw=null;
  try{raw=JSON.parse(storage.getItem(storageKey))}catch{}
  if(isObject(raw))return migrate(raw);
 }
 return blank();
}

function dropLocal(state,table,recordId){
 if(table==='checks'){const item=state.checks[recordId];delete state.checks[recordId];return item||null}
 const list=state[table];
 const index=Array.isArray(list)?list.findIndex(item=>item.id===recordId):-1;
 return index<0?null:list.splice(index,1)[0];
}

function removeRecord(state,table,recordId,now=Date.now()){
 const item=dropLocal(state,table,recordId);
 if(!item)return null;
 state.tombstones[table+':'+recordId]={table,id:recordId,space:item.space||defaultSpace,updatedAt:now};
 return item;
}

// Fuehrt einen migrierten Stand in state zusammen. Pro Datensatz gewinnt die neuere
// Fassung, ein wiederholter Import aendert nichts. Ergebnis: Anzahl der Aenderungen.
function merge(state,incoming){
 let changes=0;
 const buried=(table,item)=>{const stone=state.tombstones[table+':'+item.id];return !!stone&&!newer(stone,item)};
 for(const [stoneKey,stone] of Object.entries(incoming.tombstones)){
  if(!newer(state.tombstones[stoneKey],stone))continue;
  state.tombstones[stoneKey]=stone;
  const local=stone.table==='checks'?state.checks[stone.id]:state[stone.table]?.find(item=>item.id===stone.id);
  if(local&&!newer(stone,local))dropLocal(state,stone.table,stone.id);
  changes++;
 }
 for(const table of ['spaces',...tables]){
  for(const item of incoming[table]){
   if(buried(table,item))continue;
   const index=state[table].findIndex(existing=>existing.id===item.id);
   if(index<0)state[table].push(item);
   else if(newer(state[table][index],item))state[table][index]=item;
   else continue;
   changes++;
  }
 }
 for(const [checkId,check] of Object.entries(incoming.checks)){
  if(buried('checks',check)||(state.checks[checkId]&&!newer(state.checks[checkId],check)))continue;
  state.checks[checkId]=check;
  changes++;
 }
 return changes;
}

function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch{el('notice').textContent='Speichern im Browser fehlgeschlagen.'}}

// Abgleich mit dem Server, ohne DOM und Netz: Diese Funktionen berechnen nur, was
// hochzuladen ist, und arbeiten heruntergeladene Zeilen ein. Den Ablauf steuert
// features/sync.js.
//
// meta.known merkt sich pro Datensatz den zuletzt mit dem Server abgestimmten Stand:
//   known['tasks:abc'] = {u: updatedAt, s: Bereich auf dem Server, d: geloescht}
//   known['spaces:x'].f = Bereich ist neu sichtbar und muss noch komplett geladen werden
// Weicht der lokale Datensatz davon ab, ist er eine noch nicht hochgeladene Aenderung.
// Solche Aenderungen gewinnen gegen den Server, bis sie hochgeladen sind; danach gilt
// der Stand, der zuletzt beim Server angekommen ist.
const syncCollections=[...tables,'checks'];
const syncMetaBlank=()=>({cursor:null,known:{}});
const toServerSpace=(space,privateId)=>space===defaultSpace?privateId:space;
const toLocalSpace=(space,privateId)=>space===privateId?defaultSpace:space;
const serverTime=value=>{const ms=Date.parse(value);return Number.isFinite(ms)?ms:0};

function cleanSyncMeta(raw){
 const meta=syncMetaBlank();
 if(!isObject(raw))return meta;
 if(typeof raw.cursor==='string'&&serverTime(raw.cursor))meta.cursor=raw.cursor;
 for(const [entryKey,entry] of Object.entries(isObject(raw.known)?raw.known:{}))
  if(isObject(entry)&&typeof entry.s==='string')meta.known[entryKey]={u:number(entry.u,0,Number.MAX_SAFE_INTEGER,0),s:entry.s,d:!!entry.d,...(entry.f?{f:true}:{})};
 return meta;
}

function localRecords(state){
 const list=[];
 for(const table of tables)for(const item of state[table])list.push([table,item]);
 for(const item of Object.values(state.checks))list.push(['checks',item]);
 return list;
}
function findLocal(state,table,recordId){
 return table==='checks'?state.checks[recordId]||null:state[table].find(item=>item.id===recordId)||null;
}
// Inhalt fuer die Spalte data: alles ausser den Feldern, die eigene Spalten haben.
// changedBy kommt vom Server (updated_by) und wird nicht zurueckgeschickt.
function payload(item){
 const {id:_id,space:_space,updatedAt:_updatedAt,changedBy:_changedBy,...data}=item;
 return data;
}
const isPending=(item,known,privateId)=>!known||known.d||known.u!==item.updatedAt||known.s!==toServerSpace(item.space,privateId);

// Team-Bereiche anlegen, umbenennen oder loeschen. Der private Bereich existiert immer.
function collectSpaceOps(state,meta){
 const ops=[];
 for(const space of state.spaces){
  if(space.kind!=='team')continue;
  const known=meta.known['spaces:'+space.id];
  if(!known)ops.push({op:'create',space});
  else if(!known.d&&known.u!==space.updatedAt)ops.push({op:'rename',space});
 }
 for(const stone of Object.values(state.tombstones)){
  const known=meta.known['spaces:'+stone.id];
  if(stone.table==='spaces'&&known&&!known.d)ops.push({op:'delete',id:stone.id});
 }
 return ops;
}

// Zeilen fuer den Upload. Datensaetze in Bereichen, die der Server noch nicht kennt,
// warten, bis der Bereich angelegt ist.
function collectRows(state,meta,privateId){
 const ready=space=>space===privateId||(meta.known['spaces:'+space]&&!meta.known['spaces:'+space].d);
 const out=[];
 for(const [table,item] of localRecords(state)){
  const recordKey=table+':'+item.id;
  const known=meta.known[recordKey];
  if(!isPending(item,known,privateId))continue;
  const space=toServerSpace(item.space,privateId);
  if(!ready(space))continue;
  out.push({key:recordKey,kind:'live',snapshot:item.updatedAt,row:{space_id:space,collection:table,id:item.id,data:payload(item),deleted:false}});
  // Verschoben: im alten Bereich einen Grabstein hinterlassen.
  if(known&&!known.d&&known.s!==space)
   out.push({key:recordKey,kind:'moved',row:{space_id:known.s,collection:table,id:item.id,data:{},deleted:true}});
 }
 for(const [recordKey,stone] of Object.entries(state.tombstones)){
  if(!syncCollections.includes(stone.table))continue;
  const known=meta.known[recordKey];
  if(!known||known.d||findLocal(state,stone.table,stone.id))continue;
  out.push({key:recordKey,kind:'removed',row:{space_id:known.s,collection:stone.table,id:stone.id,data:{},deleted:true}});
 }
 return out;
}

// Nach erfolgreichem Upload: Stand als abgestimmt merken. returned sind die Zeilen,
// die der Server zurueckgibt (mit seiner updated_at).
function markPushed(state,meta,pushed,returned){
 const rowKey=row=>row.space_id+'|'+row.collection+'|'+row.id;
 const stamp=new Map(returned.map(row=>[rowKey(row),serverTime(row.updated_at)]));
 // Verschieben gilt erst als erledigt, wenn auch der Grabstein im alten Bereich ankam.
 const movedMissing=new Set(pushed.filter(entry=>entry.kind==='moved'&&!stamp.has(rowKey(entry.row))).map(entry=>entry.key));
 for(const entry of pushed){
  const {row}=entry;
  const at=stamp.get(rowKey(row));
  if(at===undefined||entry.kind==='moved'||movedMissing.has(entry.key))continue;
  if(entry.kind==='removed'){meta.known[entry.key]={u:at,s:row.space_id,d:true};continue}
  // Wurde der Datensatz waehrend des Uploads erneut geaendert, bleibt er offen.
  meta.known[entry.key]={u:entry.snapshot,s:row.space_id,d:false};
 }
}

// Ersetzt den Inhalt in place: offene Dialoge halten Verweise auf die Objekte.
function replaceContent(target,source){
 for(const field of Object.keys(target))delete target[field];
 return Object.assign(target,source);
}

// Arbeitet heruntergeladene Zeilen ein. Ergebnis: Anzahl der Aenderungen.
// moveCursor false: Nachladen eines neuen Bereichs darf die Zeitmarke nicht verschieben,
// sonst fehlen aeltere Aenderungen aus den anderen Bereichen.
function applyRows(state,meta,rows,privateId,moveCursor=true){
 let changes=0;
 const spaceIds=new Set(state.spaces.map(space=>space.id));
 // Verschieben kommt als Grabstein im alten und Datensatz im neuen Bereich, in
 // beliebiger Reihenfolge. Hat ein Datensatz hier eine lebende Zeile, wird er nur
 // ersetzt, nie erst geloescht.
 const live=new Set(rows.filter(row=>!row.deleted).map(row=>row.collection+':'+row.id));
 for(const row of rows){
  if(moveCursor&&cursorBefore(meta.cursor,row.updated_at))meta.cursor=row.updated_at;
  const table=row.collection;
  if(!syncCollections.includes(table)||!safeId(row.id)||typeof row.space_id!=='string')continue;
  const recordKey=table+':'+row.id;
  const at=serverTime(row.updated_at);
  const known=meta.known[recordKey];
  const local=findLocal(state,table,row.id);
  const stone=state.tombstones[recordKey];
  // Eigene, noch nicht hochgeladene Aenderungen gewinnen.
  if(local&&isPending(local,known,privateId))continue;
  if(!local&&stone&&(!known||!known.d))continue;
  if(row.deleted){
   if(live.has(recordKey))continue;
   if(local&&toServerSpace(local.space,privateId)!==row.space_id)continue;
   if(known&&known.s!==row.space_id&&!known.d)continue;
   if(local){dropLocal(state,table,row.id);changes++}
   state.tombstones[recordKey]={table,id:row.id,space:toLocalSpace(row.space_id,privateId),updatedAt:at};
   meta.known[recordKey]={u:at,s:row.space_id,d:true};
   continue;
  }
  if(known&&!known.d&&known.u===at&&known.s===row.space_id&&local)continue;
  const space=toLocalSpace(row.space_id,privateId);
  if(!spaceIds.has(space))continue;
  const item=cleanRecord({...(isObject(row.data)?row.data:{}),id:row.id,space,updatedAt:at,changedBy:row.updated_by},table);
  if(table==='checks'){
   const [routine,date]=row.id.split('@');
   Object.assign(item,{routine,date,done:!!item.done});
  }
  if(local)replaceContent(local,item);
  else if(table==='checks')state.checks[row.id]=item;
  else state[table].push(item);
  delete state.tombstones[recordKey];
  meta.known[recordKey]={u:at,s:row.space_id,d:false};
  changes++;
 }
 return changes;
}
const cursorBefore=(cursor,value)=>!cursor||serverTime(value)>serverTime(cursor);

const spaceInUse=(state,spaceId)=>localRecords(state).some(([,item])=>item.space===spaceId);

// Team-Bereiche vom Server einarbeiten. Ergebnis: Bereiche, die noch komplett zu laden
// sind (fresh), Bereiche, die auf dem Server geloescht wurden, hier aber noch Eintraege
// haben (stranded), und Bereiche, in denen man nicht mehr Mitglied ist (lost).
function applySpaces(state,meta,rows){
 const stranded=[];
 let changes=0;
 const visible=new Set(rows.map(row=>row.id));
 // Nur eine vollstaendige Antwort (sie enthaelt immer den eigenen privaten Bereich)
 // darf Bereiche als verloren melden; eine leere oder kaputte Liste loescht nichts.
 const complete=rows.some(row=>row.kind==='private');
 const lost=!complete?[]:Object.entries(meta.known).filter(([entryKey,entry])=>entryKey.startsWith('spaces:')&&!entry.d&&!visible.has(entry.s)).map(([,entry])=>entry.s);
 for(const row of rows){
  if(row.kind!=='team'||!safeId(row.id))continue;
  const spaceKey='spaces:'+row.id;
  const at=serverTime(row.updated_at);
  const known=meta.known[spaceKey];
  const local=state.spaces.find(space=>space.id===row.id);
  if(row.deleted){
   if(local&&!spaceInUse(state,row.id)){
    removeRecord(state,'spaces',row.id,at);
    if(state.activeSpace===row.id)state.activeSpace='alle';
    changes++;
   }else if(local)stranded.push(local.name);
   meta.known[spaceKey]={u:local?.updatedAt??at,s:row.id,d:true};
   continue;
  }
  if(local&&known&&!known.d&&known.u!==local.updatedAt)continue;
  if(!local&&state.tombstones[spaceKey]&&known&&!known.d)continue;
  const name=String(row.name||'Bereich').slice(0,60);
  if(local){
   if(local.name!==name||local.updatedAt!==at){local.name=name;local.updatedAt=at;changes++}
  }else{
   state.spaces.push({id:row.id,name,kind:'team',updatedAt:at});
   delete state.tombstones[spaceKey];
   changes++;
  }
  meta.known[spaceKey]={u:at,s:row.id,d:false,...(!known||known.f?{f:true}:{})};
 }
 const fresh=Object.entries(meta.known).filter(([entryKey,entry])=>entryKey.startsWith('spaces:')&&entry.f&&!entry.d).map(([,entry])=>entry.s);
 return {fresh,stranded,lost,changes};
}
// Entfernt einen Team-Bereich mit allem darin nur aus diesem Browser, ohne Grabsteine:
// Wer kein Mitglied mehr ist, darf dort nichts mehr loeschen oder aendern.
function forgetSpace(state,meta,spaceId){
 let removed=0;
 for(const [table,item] of localRecords(state)){
  if(item.space!==spaceId)continue;
  dropLocal(state,table,item.id);
  delete meta.known[table+':'+item.id];
  removed++;
 }
 for(const [stoneKey,stone] of Object.entries(state.tombstones))
  if(stone.space===spaceId||(stone.table==='spaces'&&stone.id===spaceId)){delete state.tombstones[stoneKey];delete meta.known[stoneKey]}
 dropLocal(state,'spaces',spaceId);
 delete meta.known['spaces:'+spaceId];
 if(state.activeSpace===spaceId)state.activeSpace='alle';
 return removed;
}
// Nach erfolgreichem Komplett-Laden: Bereiche nicht mehr als neu fuehren.
function freshDone(meta,spaceIds){
 for(const spaceId of spaceIds){const entry=meta.known['spaces:'+spaceId];if(entry)delete entry.f}
}

function register_calendar(app){
 const hours=Array.from({length:24},(_,hour)=>String(hour).padStart(2,'0')+':00');
 const minutes=time=>time.split(':').reduce((h,m)=>h*60+Number(m),0);
 function timeline(days){
  const now=new Date();
  const current=now.getHours()*60+now.getMinutes();
  const live=app.focusTime();
  const axis='<div class="time-axis"><div class="calendar-heading"></div>'+hours.map(time=>'<div>'+time+'</div>').join('')+'</div>';
  const columns=days.map(day=>{
   const logged=state.entries.filter(entry=>entry.date===day&&inSpace(entry));
   const planned=app.tasks(day).filter(task=>task.time);
   const slots=hours.map(time=>'<button class="time-slot" data-act="calendarSlot" data-id="'+day+'|'+time+'" aria-label="'+format(day)+' '+time+' – Zeitfenster öffnen">+</button>').join('');
   const events=[...planned.map(task=>({item:task,kind:task.routine?'routine':'task',length:Number(task.plannedMinutes)||30})),
    ...logged.map(item=>({item,kind:'entry',length:item.seconds/60})),
    ...(live?.date===day?[{item:live,kind:'live',length:live.seconds/60}]:[])];
   const blocks=layout(events);
   return '<div class="calendar-day '+(day===today()?'is-current':'')+'"><div class="calendar-heading"><strong>'+names[weekday(parse(day))]+' '+format(day)+'</strong><small>'+duration(sum(logged))+' erfasst</small></div><div class="calendar-hours">'+slots+blocks+'</div></div>';
  }).join('');
  const line=days.includes(today())?'<span class="now-line" style="--start:'+current+'"></span>':'';
  return '<div class="calendar-scroll" tabindex="0" aria-label="Kalenderraster"><div class="calendar-grid" style="--days:'+days.length+'">'+axis+columns+line+'</div></div>';
 }
 function untimed(days){
  const items=days.map(day=>app.tasks(day).filter(task=>!task.time));
  if(!items.some(list=>list.length))return '';
  return '<section class="untimed-calendar"><h2>Ohne Uhrzeit</h2><div class="untimed-scroll"><div class="untimed-grid">'+days.map((day,index)=>
   '<div><strong>'+names[weekday(parse(day))]+' '+format(day)+'</strong>'+items[index].map(task=>
    '<div class="untimed-task" style="--task-accent:'+goalColor(task.goal)+'">'+button(esc(task.title),task.routine?'routine':'task',task.routine||task.id)+'</div>'
   ).join('')+'</div>'
  ).join('')+'</div></div></section>';
 }
 function layout(events){
  const groups=[];
  let group,ends=[];
  const ordered=events.filter(e=>/^([01]\d|2[0-3]):[0-5]\d$/.test(e.item.time))
   .sort((a,b)=>minutes(a.item.time)-minutes(b.item.time));
  for(const event of ordered){
   const start=minutes(event.item.time);
   if(!group||ends.every(end=>end<=start)){
    group=[];groups.push(group);ends=[];
   }
   const available=ends.findIndex(end=>end<=start);
   const lane=available<0?ends.length:available;
   ends[lane]=start+Math.max(32,event.length);
   group.push({...event,lane});
  }
  return groups.flatMap(items=>{
   const lanes=Math.max(...items.map(event=>event.lane))+1;
   return items.map(({item,kind,length,lane})=>block(item,kind,length,lane,lanes));
  }).join('');
 }
 function block(item,kind,length,lane,lanes){
  if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(item.time))return '';
  const start=minutes(item.time);
  const span=Math.max(1,Math.min(1440-start,length));
  const action={task:'task',routine:'routine',entry:'editTime',live:'focus'}[kind];

  const status=kind==='live'?(item.running?' · Fokus läuft':' · Fokus pausiert'):'';
  return '<button class="calendar-block '+kind+'"'+live+' data-act="'+action+'" data-id="'+esc(key)+'" style="--start:'+start+';--length:'+span+';--lane-left:'+lane/lanes*100+'%;--lane-width:'+100/lanes+'%;--task-accent:'+goalColor(item.goal)+'" title="'+esc(item.time+' · '+item.title+status)+'"><small>'+esc(item.time)+'</small> '+esc(item.title+status)+'</button>';
 }

function register_focus(app){

function savePhase(timer){

 const start=timer.start?new Date(timer.start):null;
 if(length>0){
  const useStart=timer.segmented&&start;
  add('entries',{task:timer.task,title:timer.title,goal:timer.goal,space:timer.space||app.find(timer.task)?.space||newSpace(),
   date:useStart?date(start):timer.date,time:useStart?start.toTimeString().slice(0,5):timer.time,
   startAt:useStart?start.getTime():null,seconds:length});
 }
 timer.seconds=seconds;
 timer.start=null;
 timer.segmented=true;
}

function register_routines(app){
function occurrence(routine,day){
 const key=routine.id+'@'+day;
 return {...routine,id:key,date:day,routine:routine.id,done:!!state.checks[key]?.done};
}
function onDate(day){
 return state.routines.filter(routine=>scheduled(routine,day))
  .map(routine=>occurrence(routine,day));
}
function scheduled(routine,day){
 if(day<routine.since||(routine.until&&day>routine.until)||!routine.days.includes(weekday(parse(day))))return false;
 const serial=value=>Math.floor(Date.parse(value)/86400000);
 const monday=value=>serial(value)-weekday(parse(value));
 return ((monday(day)-monday(routine.since))/7)%(routine.interval||1)===0;
}
function find(key){
 const [routineId,day]=key.split('@');
 const routine=state.routines.find(item=>item.id===routineId);
 return day&&routine?occurrence(routine,day):null;
}
function toggle(task){
 const check=state.checks[task.id]||{id:task.id,routine:task.routine,date:task.date,space:task.space||defaultSpace};
 state.checks[task.id]={...check,done:!task.done,updatedAt:Date.now()};
}
app.routines={onDate,find,toggle};
app.page('Routinen',({w})=>{return '<h1>Routinen</h1>'+button('+ Routine','routine','','primary')+'<div class="grid space">'+(state.routines.filter(inSpace).map(r=>{const days=w.filter(d=>scheduled(r,d));const interval=r.interval||1;return '<article><h2>'+esc(r.title)+'</h2>'+spaceTag(r)+'<p>'+r.days.length+'× '+(interval===1?'pro Woche':'alle '+esc(interval)+' Wochen')+' · '+r.days.map(i=>names[i]).join(', ')+'</p><p>'+days.filter(d=>state.checks[r.id+'@'+d]?.done).length+' / '+days.length+' im ausgewählten Zeitraum erledigt</p>'+button('Bearbeiten','routine',r.id)+'</article>'}).join('')||'<p>Wähle feste Wochentage für Klavier, Sport oder andere Routinen.</p>')+'</div>';});

}

function register_sync(app){
 const pageSize=1000;
 const chunkSize=500;
 // Ueberlappung beim Abruf: Eine Aenderung kann mit etwas aelterer Serverzeit erst
 // nach einer neueren sichtbar werden. Doppelt Geladenes aendert nichts.
 const overlapMs=30000;
 // Die Daten in diesem Browser gehoeren dem Konto, das sich hier zuerst angemeldet hat.
 const ownerKey='takt-owner';
 let meta=null,running=false,again=false,timer=null,channel=null,status='',blocked=false;
 // Zeilen, die der Server inhaltlich ablehnt: in dieser Sitzung nicht erneut senden.
 const rejected=new Set();
 const metaKey=()=>'takt-sync:'+cloud.user.id;
 const ready=()=>!!(cloud.client&&cloud.user&&meta&&!blocked);
 // Fehler mit code kommen von der Datenbank (Regel verletzt), ohne code vom Netz.
 const isDataError=error=>!!error?.code&&!/^PGRST/.test(error.code);

 function setStatus(next){status=next;showStatus()}
 function showStatus(){
  const target=el('sync-status');
  if(!target)return;
  const labels={busy:'Abgleich …',ok:'Abgeglichen',offline:'Offline',error:'Abgleich fehlgeschlagen',blocked:'Abgleich angehalten'};
  target.textContent=cloud.user?labels[status]||'':'';
  target.dataset.state=status;
 }
 app.afterRender(showStatus);

 function loadMeta(){
  try{meta=cleanSyncMeta(JSON.parse(localStorage.getItem(metaKey())))}catch{meta=syncMetaBlank()}
 }
 function saveMeta(){
  try{localStorage.setItem(metaKey(),JSON.stringify(meta))}
  catch{el('notice').textContent='Der Abgleich-Stand konnte im Browser nicht gespeichert werden.'}
 }

 async function ensurePrivateSpace(){
  if(cloud.privateSpace)return;
  const {data,error}=await cloud.client.rpc('ensure_private_space');
  if(error)throw error;
  cloud.privateSpace=data;
 }

 async function pushSpaceChanges(ops){
  for(const op of ops){
   const spaceKey='spaces:'+op.space.id;
   const {error}=op.op==='create'
    ?await cloud.client.rpc('create_team_space',{p_id:op.space.id,p_name:op.space.name})
    // Nur Besitzer duerfen umbenennen; sonst setzt der naechste Abruf den Namen zurueck.
    :await cloud.client.from('spaces').update({name:op.space.name}).eq('id',op.space.id);
   if(error&&!isDataError(error))throw error;
   if(error)el('notice').textContent='Bereich „'+op.space.name+'“ konnte auf dem Server nicht gespeichert werden.';
   else meta.known[spaceKey]={u:op.space.updatedAt,s:op.space.id,d:false};
  }
 }
 // Loeschen erst nach dem Hochladen der Datensaetze: Der Server loescht nur leere Bereiche.
 async function pushSpaceDeletes(ops){
  for(const op of ops){
   const {error}=await cloud.client.rpc('delete_team_space',{p_space:op.id});
   if(error&&!isDataError(error))throw error;
   // Abgelehnt (z. B. nicht leer): Der naechste Abruf stellt den Bereich wieder her.
   if(error)el('notice').textContent='Ein Bereich konnte auf dem Server nicht gelöscht werden und wird wiederhergestellt.';
   meta.known['spaces:'+op.id]={u:0,s:op.id,d:true};
  }
 }

 async function upsert(entries){
  const {data,error}=await cloud.client.from('records')
   .upsert(entries.map(entry=>entry.row),{onConflict:'space_id,collection,id'})
   .select('space_id,collection,id,updated_at');
  return {data:data||[],error};
 }
 async function pushRecords(){
  const pending=collectRows(state,meta,cloud.privateSpace).filter(entry=>!rejected.has(entry.key+'|'+entry.snapshot));
  for(let start=0;start<pending.length;){
   let end=Math.min(start+chunkSize,pending.length);
   // Datensatz und Grabstein eines Verschiebens bleiben im selben Paket.
   while(end<pending.length&&pending[end].key===pending[end-1].key)end++;
   const chunk=pending.slice(start,end);
   start=end;
   const result=await upsert(chunk);
   if(!result.error){markPushed(state,meta,chunk,result.data);continue}
   if(!isDataError(result.error))throw result.error;
   // Ein abgelehnter Datensatz soll den Rest nicht blockieren: einzeln nachsenden.
   for(const entry of chunk){
    const single=await upsert([entry]);
    if(single.error&&!isDataError(single.error))throw single.error;
    if(single.error){console.error(single.error,entry.row);rejected.add(entry.key+'|'+entry.snapshot);continue}
    markPushed(state,meta,[entry],single.data);
   }
  }
  if(rejected.size)el('notice').textContent=rejected.size+' Einträge konnten nicht übertragen werden und bleiben nur in diesem Browser.';
 }

 async function pullSpaces(){
  const {data,error}=await cloud.client.from('spaces').select('id,name,kind,deleted,updated_at');
  if(error)throw error;
  return applySpaces(state,meta,data||[]);
 }

 // Seitenweise nach Serverzeit. Die naechste Seite beginnt bei der letzten Zeit (gte),
 // nicht bei einem Versatz: Waehrenddessen geaenderte Zeilen verschieben so nichts.
 // Doppelt geladene Zeilen aendern nichts.
 async function pullRecords(filter,since,moveCursor){
  let changes=0,lower=since;
  for(;;){
   let query=filter(cloud.client.from('records').select('space_id,collection,id,data,deleted,updated_at,updated_by'));
   if(lower)query=query.gte('updated_at',lower);
   const {data,error}=await query.order('updated_at').order('space_id').order('collection').order('id').limit(pageSize);
   if(error)throw error;
   const rows=data||[];
   changes+=applyRows(state,meta,rows,cloud.privateSpace,moveCursor);
   if(rows.length<pageSize)return changes;
   const last=rows[rows.length-1].updated_at;
   // Kann praktisch nicht vorkommen: Hochgeladen wird in Paketen zu hoechstens 500.
   if(last===lower)throw Error('Mehr als '+pageSize+' Änderungen mit gleicher Serverzeit');
   lower=last;
  }
 }

 async function syncNow(){
  if(!ready())return;
  if(running){again=true;return}
  running=true;
  setStatus('busy');
  try{
   await ensurePrivateSpace();
   const ops=collectSpaceOps(state,meta);
   await pushSpaceChanges(ops.filter(op=>op.op!=='delete'));
   await pushRecords();
   await pushSpaceDeletes(ops.filter(op=>op.op==='delete'));
   saveMeta();
   const spaces=await pullSpaces();
   let changes=spaces.changes;
   for(const spaceId of spaces.lost){
    const name=state.spaces.find(space=>space.id===spaceId)?.name||'Team-Bereich';
    const unsent=localRecords(state).filter(([table,item])=>item.space===spaceId&&isPending(item,meta.known[table+':'+item.id],cloud.privateSpace)).length;
    forgetSpace(state,meta,spaceId);
    el('notice').textContent='Du bist nicht mehr Mitglied in „'+name+'“. Der Bereich wurde aus diesem Browser entfernt'+(unsent?', '+unsent+' nicht übertragene Änderungen darin gingen verloren.':'.');
    changes++;
   }
   if(spaces.stranded.length)el('notice').textContent='Der Bereich „'+spaces.stranded.join('“, „')+'“ wurde auf dem Server gelöscht. Verschiebe die Einträge darin in einen anderen Bereich.';
   // Neu sichtbare Bereiche (z. B. nach einer Einladung) komplett laden.
   if(spaces.fresh.length){
    changes+=await pullRecords(query=>query.in('space_id',spaces.fresh),null,false);
    freshDone(meta,spaces.fresh);
   }
   const since=meta.cursor?new Date(serverTime(meta.cursor)-overlapMs).toISOString():null;
   changes+=await pullRecords(query=>query,since,true);
   saveMeta();
   if(changes){persist();render()}
   setStatus('ok');
   document.dispatchEvent(new Event('takt-synced'));
  }catch(error){
   console.error(error);
   if(meta)saveMeta();
   setStatus(navigator.onLine===false?'offline':'error');
  }finally{
   running=false;
   if(again){again=false;schedule(500)}
  }
 }
 function schedule(delay){
  if(!ready())return;
  clearTimeout(timer);
  timer=setTimeout(syncNow,delay);
 }

 // Echtzeit: Meldungen vom Server loesen nur einen Abruf aus. Die Daten selbst kommen
 // ueber den normalen Abruf, der Bereinigung und Konfliktregeln anwendet.
 function subscribe(){
  unsubscribe();
  channel=cloud.client.channel('takt-records')
   .on('postgres_changes',{event:'*',schema:'public',table:'records'},()=>schedule(300))
   .on('postgres_changes',{event:'*',schema:'public',table:'spaces'},()=>schedule(300))
   .subscribe();
 }
 function unsubscribe(){
  if(channel)cloud.client.removeChannel(channel);
  channel=null;
 }

 // Meldet sich ein anderes Konto an, als dem die Daten hier gehoeren, wird nichts
 // hochgeladen, bis entschieden ist, was mit den Daten passiert.
 function ownerDialog(){
  dialog('Daten eines anderen Kontos',
   '<p>Die Daten in diesem Browser gehören zu einem anderen Takt-Konto. Damit sie nicht in <strong>'+esc(cloud.user.email)+'</strong> landen, ist der Abgleich angehalten.</p>'+
   '<p><small>Lade zuerst eine Sicherung herunter, wenn du die Daten behalten willst.</small></p>'+
   '<div class="bar">'+button('Sicherung herunterladen','exportData')+button('Daten hier verwerfen und Konto laden','takeOver','','danger')+button('Abmelden','signOut')+'</div>');
 }
 function start(){
  let owner=null;
  try{owner=localStorage.getItem(ownerKey)}catch{}
  loadMeta();
  if(owner&&owner!==cloud.user.id){blocked=true;setStatus('blocked');ownerDialog();return}
  try{localStorage.setItem(ownerKey,cloud.user.id)}catch{}
  blocked=false;
  subscribe();
  schedule(0);
 }
 app.action('takeOver',()=>{
  if(!cloud.user)return;
  state=blank();
  persist();
  try{localStorage.setItem(ownerKey,cloud.user.id)}catch{}
  meta=syncMetaBlank();
  blocked=false;
  subscribe();
  schedule(0);
 });

 document.addEventListener('takt-signed-in',start);
 document.addEventListener('takt-signed-out',()=>{unsubscribe();clearTimeout(timer);meta=null;blocked=false;setStatus('')});
 // Jede lokale Aenderung laeuft ueber changed(): kurz sammeln, dann hochladen.
 const saveAndRender=changed;
 changed=()=>{saveAndRender();schedule(1500)};
 window.addEventListener('online',()=>schedule(0));
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')schedule(0)});
 setInterval(()=>{if(document.visibilityState==='visible')schedule(0)},60000);
 // Nach dem Austreten: Bereich hier entfernen, ohne Loeschungen hochzuladen.
 app.forgetSpace=spaceId=>{if(meta){forgetSpace(state,meta,spaceId);saveMeta();persist()}};
 app.syncNow=()=>schedule(0);
 app.action('syncNow',()=>{blocked?ownerDialog():syncNow()},{command:'Jetzt abgleichen'});
}

function register_team(app){
 // Mitglieder pro Team-Bereich und offene Einladungen an mich, vom Server geladen.
 // Die Mitgliederliste wird pro Konto im Browser gemerkt, damit Namen und Zuweisungen
 // auch offline und direkt nach dem Neuladen stimmen.
 const members=new Map();
 let invitations=[];
 // Steigt bei jeder An- oder Abmeldung: Antworten aus einer frueheren Sitzung verfallen.
 let generation=0;
 let lastLoad=0;
 const reloadMs=5*60*1000;
 const cacheKey=()=>'takt-members:'+cloud.user.id;
 const teamSpace=spaceId=>state.spaces.find(space=>space.id===spaceId&&space.kind==='team');
 const spaceMembers=spaceId=>members.get(spaceId)||[];
 function memberName(userId){
  if(!userId)return '';
  if(userId===cloud.user?.id)return 'Du';
  for(const list of members.values()){
   const member=list.find(item=>item.user_id===userId);
   if(member)return String(member.email||'').split('@')[0]||'Unbekannt';
  }
  return 'Unbekannt';
 }
 app.memberName=memberName;
 app.spaceMembers=spaceMembers;
 app.teamSpace=teamSpace;

 const snapshot=()=>JSON.stringify([[...members],invitations]);
 function loadCache(){
  try{
   const raw=JSON.parse(localStorage.getItem(cacheKey()));
   for(const [spaceId,list] of Array.isArray(raw)?raw:[])
    if(safeId(spaceId)&&Array.isArray(list))members.set(spaceId,list.filter(item=>isUserId(item?.user_id)).map(item=>({user_id:item.user_id,email:String(item.email||''),role:item.role==='owner'?'owner':'member'})));
  }catch{}
 }
 function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify([...members]))}catch{}}

 async function fetchMembers(spaceId){
  const {data,error}=await cloud.client.rpc('space_member_list',{p_space:spaceId});
  if(error)throw error;
  return data||[];
 }
 // force: sofort laden (Anmeldung, Annahme, neuer Bereich); sonst hoechstens alle 5 Minuten.
 async function loadMembers(force){
  if(!cloud.client||!cloud.user)return;
  const teamIds=state.spaces.filter(item=>item.kind==='team').map(item=>item.id);
  const unknown=teamIds.some(spaceId=>!members.has(spaceId));
  if(!force&&!unknown&&Date.now()-lastLoad<reloadMs)return;
  const run=generation,before=snapshot();
  lastLoad=Date.now();
  const loaded=new Map();
  for(const spaceId of teamIds)loaded.set(spaceId,await fetchMembers(spaceId));
  const result=await cloud.client.rpc('my_invitations');
  if(result.error)throw result.error;
  if(run!==generation||!cloud.user)return;
  members.clear();
  for(const [spaceId,list] of loaded)members.set(spaceId,list);
  invitations=result.data||[];
  saveCache();
  if(snapshot()!==before)render();
 }
 const refresh=force=>loadMembers(force).catch(error=>console.error(error));
 document.addEventListener('takt-signed-in',()=>{generation++;members.clear();invitations=[];loadCache();lastLoad=0});
 document.addEventListener('takt-synced',()=>refresh(false));
 document.addEventListener('takt-signed-out',()=>{generation++;members.clear();invitations=[];render()});

 app.afterRender(()=>{
  const target=el('invites');
  if(!target)return;
  target.hidden=!invitations.length;
  target.textContent=invitations.length===1?'1 Einladung':invitations.length+' Einladungen';
 });

 // Fehlermeldungen der Datenbank-Funktionen in verstaendliche Saetze uebersetzen.
 function explain(error){
  const known={'42501':'Dazu fehlt dir die Berechtigung, oder der Bereich ist noch nicht abgeglichen.','22023':'Das geht in diesem Bereich nicht.','54000':'Es gibt schon zu viele offene Einladungen.','P0002':'Die Einladung ist nicht mehr gültig.'};
  return known[error?.code]||(navigator.onLine===false?'Du bist offline. Versuche es später noch einmal.':'Das hat nicht geklappt. Prüfe die Internetverbindung.');
 }
 // Ergebnis einer Server-Funktion: bei Erfolg null, sonst ein verstaendlicher Satz.
 const call=(name,args)=>cloud.client?cloud.client.rpc(name,args).then(({error})=>error?explain(error):null,()=>explain(null)):Promise.resolve('Nicht angemeldet.');

 app.action('invitations',()=>{
  const rows=invitations.map(item=>'<div class="row"><strong>'+esc(item.space_name)+'</strong><small>von '+esc(item.invited_by_email||'unbekannt')+'</small>'+
   button('Annehmen','acceptInvite',item.space_id,'primary')+button('Ablehnen','declineInvite',item.space_id)+'</div>').join('');
  dialog('Einladungen',(rows||'<p>Keine offenen Einladungen.</p>')+button('Schließen','close'));
 });
 const answering=new Set();
 async function answerInvite(spaceId,accept){
  if(answering.has(spaceId))return;
  answering.add(spaceId);
  const item=invitations.find(entry=>entry.space_id===spaceId);
  const problem=await call(accept?'accept_invitation':'decline_invitation',{p_space:spaceId});
  answering.delete(spaceId);
  if(problem){el('notice').textContent=problem;return}
  invitations=invitations.filter(entry=>entry.space_id!==spaceId);
  el('notice').textContent=accept?'Du bist jetzt Mitglied in „'+(item?.space_name||'Team-Bereich')+'“. Die Einträge werden geladen.':'Einladung abgelehnt.';
  render();
  if(accept)app.syncNow();
 }
 app.action('acceptInvite',spaceId=>{answerInvite(spaceId,true)});
 app.action('declineInvite',spaceId=>{answerInvite(spaceId,false)});

 // Der Mitglieder-Dialog wird nach Server-Antworten nur neu gezeichnet, solange er noch
 // offen ist (oder gerade geschlossen wurde); einen anderen Dialog ueberschreibt er nie.
 const view=spaceId=>'members:'+spaceId;
 const mayShow=spaceId=>!el('modal').open||el('modal').dataset.view===view(spaceId);
 function show(spaceId,title,content,submit){
  dialog(title,content,submit,'Einladen');
  el('modal').dataset.view=view(spaceId);
 }
 async function openMembers(spaceId,message=''){
  const space=teamSpace(spaceId);
  if(!space||!cloud.client||!cloud.user||!mayShow(spaceId))return;
  const run=generation;
  if(!el('modal').open)show(spaceId,'Mitglieder · '+esc(space.name),'<p>Lade Mitglieder …</p>'+button('Schließen','close'));
  let list,open=[],problem='';
  try{list=await fetchMembers(spaceId);members.set(spaceId,list);saveCache()}
  catch(error){console.error(error);list=spaceMembers(spaceId);problem=explain(error)}
  const owner=list.some(item=>item.user_id===cloud.user?.id&&item.role==='owner');
  if(owner&&!problem){
   const result=await cloud.client.from('space_invitations').select('email').eq('space_id',spaceId).order('created_at');
   if(result.error)problem=explain(result.error);else open=result.data||[];
  }
  if(run!==generation||!cloud.user||!mayShow(spaceId))return;
  const rows=list.map(item=>{
   const self=item.user_id===cloud.user.id;
   const action=self?button('Austreten','leaveSpace',spaceId,'danger'):owner?button('Entfernen','removeMember',spaceId+'|'+item.user_id,'danger'):'';
   return '<div class="row"><strong>'+esc(item.email)+(self?' (du)':'')+'</strong><small>'+(item.role==='owner'?'Besitzer':'Mitglied')+'</small>'+action+'</div>';
  }).join('')||'<p>Der Bereich ist noch nicht mit dem Server abgeglichen. Versuche es gleich noch einmal.</p>';
  const pending=open.map(item=>'<div class="row"><strong>'+esc(item.email)+'</strong><small>eingeladen</small>'+button('Zurückziehen','revokeInvite',spaceId+'|'+item.email)+'</div>').join('');
  const invite=owner?field('E-Mail-Adresse einladen','email','','email','required maxlength="254" autocomplete="off"')+
   '<p><small>Takt verschickt keine E-Mail. Sag deinem Kollegen Bescheid: Er meldet sich mit genau dieser Adresse in Takt an und nimmt die Einladung oben rechts an.</small></p>':'';
  const status='<p id="team-status" role="status">'+esc(problem||message)+'</p>';
  show(spaceId,'Mitglieder · '+esc(space.name),rows+pending+invite+status+(owner?'':button('Schließen','close')),owner?form=>{
   const email=String(form.get('email')||'').trim();
   call('invite_member',{p_space:spaceId,p_email:email}).then(problem=>{
    if(problem){const target=el('team-status');if(target&&mayShow(spaceId))target.textContent=problem;return}
    openMembers(spaceId,'Einladung für '+email+' angelegt.');
   });
   return false;
  }:null);
 }
 const members$=(spaceId,message)=>openMembers(spaceId,message).catch(error=>{console.error(error);el('notice').textContent=explain(error)});
 // Aktionen schliessen den Dialog vorher; danach wird er mit dem Ergebnis wieder geoeffnet.

 app.action('revokeInvite',key=>{
  const [spaceId,...rest]=String(key).split('|');
  call('revoke_invitation',{p_space:spaceId,p_email:rest.join('|')}).then(problem=>members$(spaceId,problem||'Einladung zurückgezogen.'));
 });
 app.action('removeMember',key=>{
  const [spaceId,userId]=String(key).split('|');
  call('remove_member',{p_space:spaceId,p_user:userId}).then(problem=>members$(spaceId,problem||'Mitglied entfernt.'));
 });
 app.action('leaveSpace',spaceId=>{
  const space=teamSpace(spaceId);
  if(!space)return;
  dialog('„'+esc(space.name)+'“ verlassen?','<p>Der Bereich und alle Einträge darin verschwinden aus diesem Browser. Die anderen Mitglieder behalten sie.</p>'+
   '<div class="bar">'+button('Verlassen','confirmLeave',spaceId,'primary danger')+button('Abbrechen','close')+'</div>');
 });
 app.action('confirmLeave',spaceId=>{
  const space=teamSpace(spaceId);
  if(!space||!cloud.user)return;

  if(!item)return;
  target.dataset.act=item[0];
  target.dataset.id=item[1]();
  target.setAttribute('aria-label',item[2]);
  target.title=item[2];
 }

 // Installieren aus dem eigenen Menue anbieten, sobald Chrome es erlaubt.
 let installPrompt=null;
 window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event});
 window.addEventListener('appinstalled',()=>{installPrompt=null;el('notice').textContent='Takt ist installiert und liegt jetzt bei deinen Apps.'});
 app.action('install',()=>{
  if(!installPrompt)return;
  installPrompt.prompt();
  installPrompt=null;
 });

 const entry=(title,detail,action,value='')=>button('<strong>'+esc(title)+'</strong><small>'+esc(detail)+'</small>',action,value,'sheet-item');
 app.action('more',()=>{
  const views=[['Ziele','Ziele anlegen und erfasste Zeit sehen'],['Routinen','Feste Wochentage, z. B. Sport'],['Rückblick','Woche auswerten, Zeit pro Person']]
   .map(([name,detail])=>entry(name,detail,'go',name)).join('');
  const account=cloud.user
   ?entry('Konto',cloud.user.email,'account')+entry('Jetzt abgleichen','Änderungen sofort übertragen und abrufen','syncNow')
   :entry('Anmelden','Für Abgleich mit PC, Handy und Team','account');
  const extra=entry('Bereiche','Privat und Team-Bereiche, Mitglieder einladen','spaces')+account+
   entry('Daten','Sicherung herunterladen oder einspielen','backup')+
   (installPrompt?entry('App installieren','Takt als App auf dem Startbildschirm','install'):'');
  dialog('Mehr','<div class="sheet-list">'+views+'</div><div class="sheet-list">'+extra+'</div>'+button('Schließen','close'));
 });

 // Zurueck-Taste: Von jeder Ansicht geht es zuerst zu "Heute", erst dann aus der App.
 // Dafuer liegt ausserhalb von "Heute" genau ein zusaetzlicher Verlaufseintrag.
 // history.back() wirkt verzoegert: Wechselt man vorher schon weiter, darf das spaete
 // popstate nicht auf "Heute" zuruecksetzen (leaving), sondern legt den Eintrag neu an.
 let pushed=false,leaving=false;
 function history$(){
  if(leaving)return;
  const home=session.view==='Heute';
  if(!home&&!pushed){history.pushState({takt:'away'},'');pushed=true}
  else if(home&&pushed){leaving=true;history.back()}
 }
 window.addEventListener('popstate',event=>{
  if(event.state?.takt==='away')return;
  const expected=leaving;
  leaving=false;
  if(!pushed)return;
  pushed=false;
  if(session.view==='Heute')return;
  if(expected)return history$();
  // Offener Dialog: Zurueck schliesst nur den Dialog, die Ansicht bleibt.
  if(el('modal').open){el('modal').close();return history$()}
  app.go('Heute');
  render();
 });

 // Bildschirm waehrend eines laufenden Fokus-Timers anlassen.
 let lock=null,requesting=false;
 function keepAwake(){
  const wanted=session.view==='Fokus'&&!!state.timer?.start&&document.visibilityState==='visible';
  if(wanted&&!lock&&!requesting&&navigator.wakeLock){
   requesting=true;
   navigator.wakeLock.request('screen').then(sentinel=>{
    lock=sentinel;
    sentinel.addEventListener('release',()=>{if(lock===sentinel)lock=null});
    if(session.view!=='Fokus'||!state.timer?.start)sentinel.release();
   },()=>{}).finally(()=>{requesting=false});
  }
  if(!wanted&&lock){lock.release();lock=null}
 }
 document.addEventListener('visibilitychange',keepAwake);

 app.afterRender(()=>{tabbar();fab();history$();keepAwake()});

 // Kurzbefehle vom App-Icon (lange druecken): ?view=Plan oeffnet direkt den Plan.
 const params=new URLSearchParams(location.search);
 const start=params.get('view');
 if(start){
  params.delete('view');
  const rest=params.toString();
  history.replaceState(null,'',location.pathname+(rest?'?'+rest:'')+location.hash);
  if(start!=='Heute')app.go(start);
 }

 // Offline-Start und Installation. Nur ueber eine Web-Adresse, nicht als lokale Datei.
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))
  navigator.serviceWorker.register('sw.js').catch(error=>console.error(error));
}
